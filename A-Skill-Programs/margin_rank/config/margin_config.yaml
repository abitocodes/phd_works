# GMX V2 margin trading wallet ranking — full dissertation observation window

protocol: gmx_v2_arbitrum
chain_id: 42161
chain_name: Arbitrum One

period:
  start_date: "2025-12-01"
  end_date: "2026-06-01"  # exclusive end (through 2026-05-31 23:59:59 UTC)
  start_ts: "2025-12-01 00:00:00 UTC"
  end_ts: "2026-06-01 00:00:00 UTC"

bigquery:
  project_id: null  # uses GOOGLE_CLOUD_PROJECT or ADC default
  # crypto_arbitrum is deprecated; use goog_blockchain_arbitrum_one_us
  logs_fqn: bigquery-public-data.goog_blockchain_arbitrum_one_us.logs
  transactions_fqn: bigquery-public-data.goog_blockchain_arbitrum_one_us.transactions

gmx_arbitrum:
  event_emitter: "0xC8ee91A54287DB53897056e12D9819156D3822Fb"
  liquidation_handler: "0xaf157Eb8e2398A8E1Fc1dA929974652b9ba9BC25"
  exchange_router: "0x1C3fa76e6E1088bCE750f23a5BFcffa1efEF6A41"
  # Order.OrderType.Liquidation enum value
  order_type_liquidation: 7

events:
  position_increase: PositionIncrease
  position_decrease: PositionDecrease
  # EventLog1 topic0 — verified on-chain (goog_blockchain_arbitrum_one_us)
  event_log1_topic0: "0x137a44067c8961cd7e1d876f4754a5a3a75989b4552f1843fc69c3b372def160"

ranking:
  min_closes: 3
  success_field: basePnlUsd

paths:
  manifest: data/processed/extraction_manifest.json
  eval_summary: data/processed/eval_summary.json
  raw_logs: data/raw/gmx_event_logs_2025-12_to_2026-05.parquet
  decoded_events: data/processed/gmx_decoded_events.parquet
  wallet_rankings: data/processed/wallet_rankings.parquet
  raw_lending_dir: data/raw/lending
  aave_events: data/processed/lending/aave_events.parquet

methods:
  gf_pr: { enabled: true }
  lp_pr: { enabled: true }
  cw_awp: { enabled: true }
  lf_pr: { enabled: true }
  riskprop_pr: { enabled: true }

# Arbitrum collateral tokens for CW-AWP (lowercase applied at runtime)
collateral_tokens:
  - "0xaf88d065e77c8cc2239327c5edb3a432268e5831"   # USDC
  - "0xff970a61a04b1ca14834a43f5de4533ebd5e8cc8"   # USDC.e
  - "0x82af49447d8a07e3bd95bd0d56f35241523fbab1"   # WETH

aave_arbitrum:
  pool_addresses:
    - "0x794a61358D6845594F94dc1DB02A252b5b4814aD"
  event_topics:
    borrow: "0xb3d084820fb1a9decffb176436bd02558d15fac9b0ddfed8c465bc7359d7dce0"
    repay: "0xa534c8dbe71f871f9f3530e97a74601fea17b426cae02e1c5aee42c96c784051"
    liquidation_call: "0xe413a321e8681d831f4dbccbca790d2952b56f977908e45be37335533e005286"

reputation:
  observation_start_ts: "2025-12-01 00:00:00 UTC"
  observation_end_ts: "2026-06-01 00:00:00 UTC"
  observation_end: "2026-05-31 23:59:59 UTC"
  damping: 0.85
  pagerank_tolerance: 1.0e-8
  max_iterations: 100
  awp_decay_k: 0.01
  awp_decay_t0_days: 180
  approval_topic0: "0x8c5be1e5ebec7d5bd14f71427d1e84f3dd0314c0f7b2291e5b200ac8c7c3b925"
  transfer_topic0: "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"
  paths:
    raw_approvals_dir: data/raw/reputation/approvals
    raw_transfers_dir: data/raw/reputation/transfers
    latest_allowances: data/processed/reputation/latest_allowances.parquet
    transfer_events: data/processed/reputation/transfer_events.parquet

budget:
  max_bytes_per_query: 161061273600  # 150 GiB per query; abort if dry-run exceeds
  # Target cumulative scan: <= 1 TiB/month (BigQuery free tier) for Tier 1+2
  # Tier 1 alignment (~80-350 GiB est.): GMX 6mo + monthly Approval/Transfer
  # Tier 2 benchmark (10k/50k/100k): subgraph from parquet; no extra BQ scans

proxies:
  # All proxies oriented: higher value => higher expected reputation (before tau/rho).
  transfer:
    columns: [in_degree, in_value]
    source: transfer_events
  allowance:
    columns: [in_approve_degree, in_approve_value]
    source: latest_allowances
  liquidation:
    columns: [liquidation_free_rate, zero_liquidation_flag, liquidation_free_closes]
    source: gmx_decoded_events
  inverse_risk:
    columns: [loss_avoidance, non_loss_close_rate, worst_close_pnl_score]
    source: gmx_decoded_events
  sybil_stability:
    columns: [inbound_counterparty_ratio, transfer_tenure_days, active_months]
    source: transfer_events
  gmx_success:
    columns: [close_success_count, realized_gain_proxy, close_success_rate]
    source: gmx_decoded_events

benchmark:
  seed: "endorserank-benchmark-v1"
  target_wallets: 100000
  stages: [10000, 50000, 100000]
  # Optional parquet with wallet column (BQ-sampled active addresses); if absent,
  # deterministic SHA256(seed:i) addresses pad the GMX set to target_wallets.
  supplemental_path: null
  wallet_set_path: data/processed/extraction_wallet_set.parquet
